[package]
name = "gr-ntru"
version = "0.1.0"
edition = "2021"
description = "Group ring NTRU experiments over cyclic, dihedral, and symmetric groups"
license = "MIT"
repository = "https://github.com/walters-labs/gr-ntru"
homepage = "https://github.com/walters-labs/gr-ntru"
documentation = "https://docs.rs/gr-ntru"
readme = "README.md"
keywords = ["cryptography", "ntru", "group-rings", "fft", "post-quantum"]
categories = ["cryptography", "mathematics", "algorithms"]

[features]
default = ["fft"]
fft = ["dep:fft-dihedral", "dep:fft-symmetric"]

[dependencies]
fft-dihedral = { version = "0.2.0", optional = true }
fft-symmetric = { version = "0.2.0", optional = true }

[lib]
name = "gr_ntru"
path = "src/lib.rs"

[[bin]]
name = "gr-ntru"
path = "src/main.rs"
